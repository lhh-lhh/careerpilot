<text x="384" y="245" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">悬停入口</text>
<rect x="504" y="218" width="192" height="44" fill="#23409b" rx="10"  />
<text x="600" y="245" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">按下反馈</text>
<rect x="720" y="218" width="192" height="44" fill="#ffffff" rx="10" stroke="#65718a" />
<text x="816" y="245" fill="#16233a" font-size="14" font-weight="600" text-anchor="middle">键盘焦点</text>
<rect x="716" y="214" width="200" height="52" fill="none" rx="13" stroke="#2f55c8" stroke-width="2"/>
<rect x="936" y="218" width="192" height="44" fill="#eef2f9" rx="10" stroke="#65718a" />
<text x="1032" y="245" fill="#606d85" font-size="14" font-weight="600" text-anchor="middle">不可用</text>
<rect x="1152" y="218" width="192" height="44" fill="#ffffff" rx="10" stroke="#65718a" />
<circle cx="1178" cy="240" r="7" fill="none" stroke="#2f55c8" stroke-width="2" stroke-dasharray="30 14"/>
<text x="1248" y="245" fill="#16233a" font-size="14" font-weight="600" text-anchor="middle">处理中…</text>
<rect x="48" y="318" width="652" height="316" fill="#ffffff" rx="14" stroke="#e3e9f2" />
<text x="72" y="353" fill="#16233a" font-size="19" font-weight="600" >字段与选择器</text>
<text x="72" y="378" fill="#42516c" font-size="13" font-weight="400" >标签可见、错误贴近、触点清晰；保留原生语义</text>
<text x="72" y="432" fill="#16233a" font-size="14" font-weight="600" >字段标签</text>
<rect x="72" y="444" width="604" height="44" fill="#ffffff" rx="10" stroke="#65718a" />
<text x="86" y="472" fill="#42516c" font-size="15" font-weight="400" >已填写内容</text>
<text x="72" y="530" fill="#16233a" font-size="14" font-weight="600" >校验失败示例</text>
<rect x="72" y="542" width="604" height="44" fill="#ffffff" rx="10" stroke="#65718a" />
<text x="86" y="570" fill="#42516c" font-size="15" font-weight="400" >原值保留</text>
<text x="72" y="607" fill="#b52c36" font-size="14" font-weight="400" >具体错误就近说明，不自动清空或覆盖输入。</text>
<rect x="724" y="318" width="668" height="316" fill="#ffffff" rx="14" stroke="#e3e9f2" />
<text x="748" y="353" fill="#16233a" font-size="19" font-weight="600" >列表 / 表格 / 状态反馈</text>
<text x="748" y="378" fill="#42516c" font-size="13" font-weight="400" >表头、行分隔、选中和键盘焦点不只依赖颜色</text>
<text x="748" y="430" fill="#16233a" font-size="15" font-weight="600" >加载时保留框架</text>
<text x="748" y="477" fill="#16233a" font-size="15" font-weight="400" >无数据与筛选无结果区分</text>
<text x="748" y="524" fill="#16233a" font-size="15" font-weight="400" >失败保留草稿与恢复入口</text>
<text x="748" y="571" fill="#16233a" font-size="15" font-weight="400" >权限不足不呈现越权内容</text>
<rect x="48" y="658" width="1344" height="282" fill="#ffffff" rx="14" stroke="#e3e9f2" />
<text x="72" y="693" fill="#16233a" font-size="19" font-weight="600" >动态与滚动：只呈现，不驱动业务</text>
<text x="72" y="718" fill="#42516c" font-size="13" font-weight="400" >持续动画默认不启用；可见的静态背景本身就必须达到设计目标</text>
<text x="72" y="773" fill="#42516c" font-size="15" font-weight="400" >按钮 120ms / 状态 200ms / 窗口 260ms / 首次渐入 240ms、≤8px</text>
<text x="72" y="812" fill="#42516c" font-size="15" font-weight="400" >背景可选局部缓动 14–20s，提供暂停，离屏停止，减少动态模式为静态</text>
<text x="72" y="851" fill="#42516c" font-size="15" font-weight="400" >正文默认可见；不劫持滚轮、不自动移动审核表格、不用假进度或假波形</text>
<text x="72" y="890" fill="#42516c" font-size="15" font-weight="400" >AI、录音、草稿页面不因主题/窗口/响应式调整而重挂载，不改 RouterView key</text>
<text x="32" y="1018" fill="#42516c" font-size="12" font-weight="400" >最终设计候选 v1.0 · 静态设计 / 合成排版内容 / 非运行截图 / 业务与 AI 不变</text>
</svg>