<text x="48" y="72" fill="#16233a" font-size="30" font-weight="600" >交互的精致，来自每一个状态。</text>
<rect x="48" y="118" width="1344" height="176" fill="#ffffff" rx="14" stroke="#e3e9f2" />
<text x="72" y="153" fill="#16233a" font-size="19" font-weight="600" >入口与按钮</text>
<text x="72" y="178" fill="#42516c" font-size="13" font-weight="400" >default / hover / pressed / focus-visible / disabled / loading</text>
