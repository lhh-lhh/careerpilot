<text x="94" y="640" fill="#16233a" font-size="18" font-weight="600" >协议与去向：真实条款、附件、版本与办理历史</text>
<text x="94" y="680" fill="#42516c" font-size="14" font-weight="400" >长内容自然增长；不隐藏信息换取卡片整齐。</text>
<text x="94" y="713" fill="#42516c" font-size="14" font-weight="400" >文书预览保留白纸，装饰只在外部框架。</text>
