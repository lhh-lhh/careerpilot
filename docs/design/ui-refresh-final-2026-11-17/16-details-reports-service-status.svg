<text x="94" y="462" fill="#16233a" font-size="18" font-weight="600" >AI 报告：逐轮反馈、原始来源与历史生成标识</text>
<text x="94" y="502" fill="#42516c" font-size="14" font-weight="400" >长内容自然增长；不隐藏信息换取卡片整齐。</text>
<text x="94" y="535" fill="#42516c" font-size="14" font-weight="400" >文书预览保留白纸，装饰只在外部框架。</text>
