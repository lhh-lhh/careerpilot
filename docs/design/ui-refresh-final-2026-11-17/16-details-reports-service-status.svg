<text x="72" y="180" fill="#42516c" font-size="13" font-weight="400" >返回与来源 → 任务标题 → 证据 / 正文 → 历史版本 → 原操作</text>
<rect x="72" y="242" width="804" height="150" fill="#eef2f9" rx="12"  />
<text x="94" y="284" fill="#16233a" font-size="18" font-weight="600" >岗位详情：要求、资格、来源、时间及校外跳转</text>
<text x="94" y="324" fill="#42516c" font-size="14" font-weight="400" >长内容自然增长；不隐藏信息换取卡片整齐。</text>
<text x="94" y="357" fill="#42516c" font-size="14" font-weight="400" >文书预览保留白纸，装饰只在外部框架。</text>
